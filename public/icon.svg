<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Liquid Gradient for 'P' Monogram -->
    <linearGradient id="p-monogram-grad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Glass Edge Highlight -->
    <linearGradient id="glass-rim" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Outer Soft Glow -->
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Obsidian Canvas Squircle -->
  <rect width="32" height="32" rx="7.5" fill="#030712" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" stroke="url(#glass-rim)" stroke-width="1.2" fill="none" />

  <!-- Modern Geometric 'P' Monogram -->
  <path 
    d="M9 6h8.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H13.5v9H9V6z" 
    fill="url(#p-monogram-grad)" 
    filter="url(#p-glow)" 
  />
  
  <!-- Inner Counter of 'P' -->
  <rect x="13.5" y="10.25" width="4.5" height="3.5" rx="1.5" fill="#030712" />

  <!-- Liquid Core Accent Spark ◈ -->
  <polygon points="21,20.5 22.5,22 21,23.5 19.5,22" fill="#38bdf8" />
</svg>
