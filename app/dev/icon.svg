<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Circular clip for portrait avatar -->
    <clipPath id="avatar-circle">
      <circle cx="32" cy="32" r="27" />
    </clipPath>

    <!-- Glowing Cyber Accent Rim Gradient -->
    <linearGradient id="cyber-rim-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8ee7ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Outer Glow Aura -->
    <filter id="avatar-aura" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#8ee7ff" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Obsidian Canvas Base -->
  <rect width="64" height="64" rx="16" fill="#030712" />

  <!-- Avatar Portrait with Circular Crop & Cyber Glow -->
  <g filter="url(#avatar-aura)">
    <circle cx="32" cy="32" r="27" fill="#0b1329" />
    <image 
      href="/images/prajwal-portrait.jpg" 
      xlink:href="/images/prajwal-portrait.jpg" 
      x="5" 
      y="5" 
      width="54" 
      height="54" 
      preserveAspectRatio="xMidYMid slice" 
      clip-path="url(#avatar-circle)" 
    />
    <!-- Glowing Cyber Border Rim -->
    <circle cx="32" cy="32" r="27" stroke="url(#cyber-rim-grad)" stroke-width="2.5" fill="none" />
  </g>

  <!-- Live Status Beacon Dot (Available for Hire) -->
  <circle cx="49" cy="49" r="4.5" fill="#10b981" stroke="#030712" stroke-width="1.8" />
</svg>
